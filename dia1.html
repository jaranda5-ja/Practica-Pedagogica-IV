body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    /* Fondo celeste cielo suave de la imagen */
    background-color: #e2f1f8; 
    color: #4a3e4d; /* Texto purpúreo/oscuro suave, no negro rígido */
    line-height: 1.6;
}

/* Encabezado con efecto de bordes ondulados simulados */
.hero {
    background: linear-gradient(180deg, #b3e5fc, #e2f1f8);
    padding: 80px 20px 60px 20px;
    text-align: center;
    position: relative;
}

.hero h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 52px;
    color: #7c5295; /* Color lila/púrpura del título de la imagen */
    margin: 0 0 10px 0;
    text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
}

.hero p {
    font-size: 18px;
    color: #e57373; /* Color coral/naranja del botón e indicaciones */
    font-weight: 700;
    margin: 0;
}

.container {
    padding: 20px;
    max-width: 900px;
    margin: auto;
}

/* Barra de datos de autoría */
.info {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: -20px;
    margin-bottom: 40px;
}

.card-info {
    background: #ffffff;
    padding: 10px 18px;
    border-radius: 50px; /* Completamente redondeado como píldora */
    box-shadow: 0 8px 15px rgba(124, 82, 149, 0.08);
    font-size: 14px;
    font-weight: 700;
    color: #6a5b6e;
    border: 2px solid #fff;
}

/* Cuadrícula de tarjetas principales (Estilo papel/pergamino) */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    margin-top: 30px;
}

.card {
    background: #fdfbf7; /* Blanco roto/crema como las hojitas de la foto */
    padding: 30px 25px;
    /* Bordes ligeramente asimétricos para dar efecto orgánico/papel hecho a mano */
    border-radius: 20px 30px 25px 20px; 
    box-shadow: 0 10px 20px rgba(124, 82, 149, 0.06);
    transition: all 0.3s ease;
    border: 1px solid rgba(235, 230, 220, 0.7);
}

.card:hover {
    transform: translateY(-5px) rotate(1deg); /* Ligera rotación juguetona */
    box-shadow: 0 15px 25px rgba(124, 82, 149, 0.1);
}

.card h3 {
    font-family: 'Fredoka', sans-serif;
    color: #e57373; /* Tonalidad coral */
    margin-top: 0;
    font-size: 22px;
}
