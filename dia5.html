/* --- CONFIGURACIÓN GENERAL EN TODA LA PANTALLA (FULL WINDOW) --- */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Quicksand', sans-serif;
  /* Fondo mágico degradado inmersivo inspirado en tu imagen */
  background: linear-gradient(180deg, #eef2ff 0%, #fce7f3 40%, #fef08a 75%, #fbcfe8 100%);
  background-attachment: fixed;
  color: #2c3e50;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* El contenedor ahora ocupa el 100% del ancho para un efecto inmersivo total */
.main-container {
  width: 100%;
  max-width: 1200px; /* Se expande más en pantallas de PC */
  padding: 40px 24px;
  position: relative;
  z-index: 10;
}

/* --- ELEMENTOS DECORATIVOS DE FONDO (CHISPAS Y ESTRELLAS) --- */
.decoracion-entorno {
  position: fixed;
  font-size: 24px;
  pointer-events: none;
  z-index: 1;
  opacity: 0.6;
  animation: flotarSuave 4s infinite ease-in-out;
}
.deco1 { top: 12%; left: 4%; animation-delay: 0s; }
.deco2 { top: 25%; right: 5%; animation-delay: 1s; font-size: 32px; }
.deco3 { bottom: 30%; left: 3%; animation-delay: 2s; }
.deco4 { bottom: 15%; right: 4%; animation-delay: 1.5s; }

@keyframes flotarSuave {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
}

/* --- SECCIÓN HERO INMERSIVA --- */
.hero-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 40px;
  padding: 40px 0;
  flex-wrap: wrap;
}

.titulo-grupo {
  flex: 1;
  min-width: 320px;
  position: relative;
}

/* Efecto de destellos al lado del título */
.titulo-grupo::before {
  content: '✨';
  position: absolute;
  top: -25px;
  left: -10px;
  font-size: 28px;
  color: #ffcc29;
}

.titulo-grupo h1 {
  font-family: 'Fredoka', sans-serif;
  font-size: 72px; /* Letras grandes y alegres */
  margin: 0;
  background: linear-gradient(45deg, #4f46e5, #9333ea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 4px 0px rgba(255,255,255,0.8));
}

.subtitulo-cinta {
  background: #1e90ff;
  color: white;

  padding: 14px 28px;

  font-size: 18px;
  font-weight: 600;
  border-radius: 14px;
  margin-top: 15px;
  box-shadow: 0 8px 20px rgba(30, 144, 255, 0.4);
}

/* Bloque de datos tipo Post-it curvilíneo */
.datos-flotantes {
  background: #ffffff;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 12px 35px rgba(244, 63, 94, 0.15);
  width: 310px;
  border: 2px solid #fecdd3;
  transform: rotate(1deg);
  transition: transform 0.3s;
}
.datos-flotantes:hover {
  transform: rotate(0deg) scale(1.03);
}

.dato-item {
  font-size: 15px;
  margin-bottom: 12px;
  color: #4f46e5;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 12px;
}
.dato-item:last-child { margin-bottom: 0; }

/* --- REJILLA TRIPLE HORIZONTAL / ADAPTABLE --- */
.tarjetas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
  margin-top: 20px;
}

.tarjeta-pastel {
  padding: 40px 30px;
  border-radius: 28px;
  background: white;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
  border: 2px solid transparent;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.tarjeta-pastel:hover {
  transform: translateY(-8px);
}

.tarjeta-pastel h3 {
  font-family: 'Fredoka', sans-serif;
  font-size: 24px;
  margin-top: 0;
  margin-bottom: 16px;
}

.tarjeta-pastel.interaccion { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
.tarjeta-pastel.expresion { border-color: #bae6fd; background: #f0f9ff; color: #0369a1; }

.tarjeta-pastel p {

}

  border-radius: 24px;

  border: 12px solid white;
}

/* --- SECCIONES CONCEPTUALES BAJAS --- */

  font-family: 'Fredoka', sans-serif;

}

  position: relative;
}

.frases-titulo {
  font-family: 'Fredoka', sans-serif;
  text-align: center;
  color: #db2777;
  font-size: 24px;
  margin-top: 0;
  margin-bottom: 35px;
}

.frases-flex {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
}

.frase-capsula {
  flex: 1;
  min-width: 280px;
  background: #ffffff;
  padding: 25px 30px;
  border-radius: 20px;
  font-size: 15px;
  color: #334155;
  box-shadow: 0 8px 20px rgba(0,0,0,0.02);

  font-style: italic;
  position: relative;
}
