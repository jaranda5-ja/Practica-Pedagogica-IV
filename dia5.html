<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Día 4 - Collage</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
    }

    .seccion-collage {
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTENEDOR */
    .contenedor-collage {
      max-width: 900px;
      width: 100%;
      background: white;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      position: relative;
      transition: transform 0.3s ease;
    }

    .contenedor-collage:hover {
      transform: scale(1.02);
    }

    /* IMAGEN */
    .contenedor-collage img {
      width: 100%;
      border-radius: 20px;
      display: block;
    }

    /* DECORACIÓN */
    .contenedor-collage::before {
      content: "⭐";
      position: absolute;
      top: -15px;
      left: -15px;
      font-size: 30px;
    }

    .contenedor-collage::after {
      content: "✨";
      position: absolute;
      bottom: -15px;
      right: -15px;
      font-size: 30px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .contenedor-collage {
        padding: 15px;
      }
    }

  </style>
</head>

<body>

  <section class="seccion-collage">
    <div class="contenedor-collage">
      <!-- CAMBIA SOLO ESTA RUTA -->
      <img src="Dia-5.jpg">
    </div>
  </section>

</body>
</html>
